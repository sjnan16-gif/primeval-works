plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()

    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com'
    }

    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup('com.geckolib')
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            def quickPlayWorld = providers.gradleProperty('quickPlayWorld')
            if (quickPlayWorld.isPresent()) {
                programArguments.addAll '--quickPlaySingleplayer', quickPlayWorld.get()
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('build').configure {
    finalizedBy tasks.named('prepareClientRun')
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            geckolib_version       : geckolib_version,
            jei_version            : jei_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def releaseJarTask = tasks.named('jar', Jar)
def verifyReleaseJar = tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Checks that the distributable jar exactly contains every compiled class and processed resource.'
    dependsOn releaseJarTask
    inputs.files(sourceSets.main.output)
    inputs.file(releaseJarTask.flatMap { it.archiveFile })

    doLast {
        File archive = releaseJarTask.get().archiveFile.get().asFile
        Map<String, File> expected = new LinkedHashMap<>()
        sourceSets.main.output.classesDirs.files.each { File root ->
            if (!root.isDirectory()) return
            root.eachFileRecurse(groovy.io.FileType.FILES) { File file ->
                expected[root.toPath().relativize(file.toPath()).toString().replace('\\', '/')] = file
            }
        }
        File resources = sourceSets.main.output.resourcesDir
        if (resources != null && resources.isDirectory()) {
            resources.eachFileRecurse(groovy.io.FileType.FILES) { File file ->
                expected[resources.toPath().relativize(file.toPath()).toString().replace('\\', '/')] = file
            }
        }

        Set<String> entries = new LinkedHashSet<>()
        List<String> mismatched = []
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            zip.entries().each { entry -> entries.add(entry.name) }
            expected.each { String path, File source ->
                def entry = zip.getEntry(path)
                if (entry != null && !java.util.Arrays.equals(
                        java.nio.file.Files.readAllBytes(source.toPath()),
                        zip.getInputStream(entry).withCloseable { it.readAllBytes() })) {
                    mismatched.add(path)
                }
            }
        }

        List<String> missing = expected.keySet().findAll { !entries.contains(it) }.toList()
        List<String> required = [
                'META-INF/neoforge.mods.toml',
                'primevalworks.mixins.json',
                'com/primevalworks/client/PrimevalWorksClient.class',
                'com/primevalworks/client/render/IrisPipelineCompat.class',
                'com/primevalworks/client/screen/WorksitePlannerScreen.class',
                'com/primevalworks/client/screen/EnergyNetworkScreen.class',
                'com/primevalworks/client/effect/DinoWhistleClient.class',
                'assets/primevalworks/models/item/primordial_sword_3d.json',
                'assets/primevalworks/models/block/turbine_part.json',
                'data/minecraft/tags/block/mineable/pickaxe.json',
                'data/minecraft/tags/block/mineable/axe.json',
                'data/minecraft/tags/block/needs_diamond_tool.json',
                'data/primevalworks/recipe/hardwood.json'
        ].findAll { !entries.contains(it) }
        List<String> forbidden = entries.findAll {
            it.endsWith('.bbmodel')
                    || it.endsWith('.java')
                    || it.endsWith('.log')
                    || it.startsWith('run-')
                    || it.contains('/run-')
                    || it.startsWith('art/')
                    || it.startsWith('docs/')
                    || it.startsWith('.idea/')
                    || it.startsWith('.git/')
        }.toList()
        if (!missing.isEmpty() || !mismatched.isEmpty() || !required.isEmpty() || !forbidden.isEmpty()) {
            throw new GradleException("Release jar verification failed. Missing=${missing + required}, mismatched=${mismatched}, forbidden=${forbidden}")
        }
        logger.lifecycle("Verified ${expected.size()} compiled classes and resources inside ${archive.name}")
    }
}

tasks.named('check').configure {
    dependsOn verifyReleaseJar
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
